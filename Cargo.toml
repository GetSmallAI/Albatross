[package]
name = "albatross-cli"
version = "2.1.0"
edition = "2021"
rust-version = "1.86"
description = "Open source, terminal-first AI coding agent with fully transparent multi-model routing. Local (Ollama, LM Studio, MLX, llama.cpp) or cloud, your keys, one TUI."
license = "MIT"
repository = "https://github.com/morganlinton/Albatross"
homepage = "https://albatross.sh"
readme = "README.md"
keywords = ["ai", "coding-agent", "llm", "cli", "ollama"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "albatross"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util", "process", "fs", "time", "signal", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
futures-util = "0.3"
crossterm = "0.28"
regex = "1"
globset = "0.4"
walkdir = "2"
ignore = "0.4"
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
anyhow = "1"
tempfile = "3"

[dev-dependencies]

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
